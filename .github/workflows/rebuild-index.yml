name: Rebuild theme index

on:
  workflow_dispatch:
  push:
    paths:
      - 'sources.json'
      - 'hosted.json'
      - 'scripts/build_index.py'
      - '.github/workflows/rebuild-index.yml'
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rebuild themes.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_index.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- themes.json; then
            echo "themes.json unchanged"
            exit 0
          fi
          git config user.name "xecpro-themebot"
          git config user.email "bot@users.noreply.github.com"
          git add themes.json
          git commit -m "index: rebuild themes.json"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push raced with another writer, retry $i"
            sleep 6
          done
          exit 1

      - name: Purge jsDelivr cache
        run: |
          curl -sS -m 30 "https://purge.jsdelivr.net/gh/byBOOK10086/XECKernelPro-Themes@main/themes.json" || true
